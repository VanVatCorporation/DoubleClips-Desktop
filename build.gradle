plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.runtime' version '1.13.0'
}

group 'com.vanvatcorporation'
version '1.2.0'

dependencies {
    implementation 'io.github.mkpaz:atlantafx-base:2.0.1'
    implementation 'org.kordamp.ikonli:ikonli-javafx:12.3.1'
    implementation 'org.kordamp.ikonli:ikonli-materialdesign2-pack:12.3.1'
    implementation 'com.github.Dansoftowner:jSystemThemeDetector:3.6'

    // Networking & Auth
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
}

javafx {
    version = "21"
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.media', 'javafx.swing' ]
}

application {
    mainClass = 'com.vanvatcorporation.doubleclips.Main'
}

runtime {
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
    
    // For non-modular projects, only list standard JDK modules here.
    // JavaFX modules are automatically handled by the openjfx plugin.
    modules = [
        'java.base',
        'java.desktop',
        'java.naming',
        'java.scripting',
        'java.xml',
        'jdk.unsupported',
        'java.sql',
        'java.net.http'
    ]

    jpackage {
        imageName = 'DoubleClips'
        appVersion = '1.2.0'

        if (org.gradle.internal.os.OperatingSystem.current().macOsX) {
            imageOptions = [
                '--icon', project.file('src/main/resources/icons/app.icns').absolutePath,
                '--mac-package-identifier', 'com.vanvatcorporation.doubleclips',
                '--mac-package-name', 'DoubleClips'
            ]
            installerOptions = [
                '--icon', project.file('src/main/resources/icons/app.icns'),
                '--vendor', 'VanVat Corporation'
            ]
            installerType = 'dmg'
        } else if (org.gradle.internal.os.OperatingSystem.current().windows) {
            imageOptions = ['--icon', project.file('src/main/resources/icons/app.ico').absolutePath]
            installerOptions = [
                '--icon', project.file('src/main/resources/icons/app.ico'),
                '--vendor', 'VanVat Corporation',
                '--win-dir-chooser',
                '--win-shortcut',
                '--win-menu',
                '--type', 'exe'
            ]
            installerType = 'exe'
        }
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
// Custom task to inject FFmpeg binary into the prepared JPackage image
tasks.register("copyFfmpegBinaries", Copy) {
    mustRunAfter(tasks.named("jpackageImage"))
    
    def os = org.gradle.internal.os.OperatingSystem.current()
    def arch = System.getProperty("os.arch").toLowerCase()
    
    def binaryDir = ""
    def binaryName = ""
    
    if (os.isWindows()) {
        binaryDir = arch.contains("aarch64") || arch.contains("arm") ? "windows-arm" : "windows"
        binaryName = "bin/ffmpeg.exe"
    } else if (os.isMacOsX()) {
        binaryDir = "macos"
        binaryName = "ffmpeg"
    } else {
        // Fallback or Linux
        binaryDir = "linux"
        binaryName = "ffmpeg"
    }

    from("bin/${binaryDir}/${binaryName}") {
        // Ensure executable permissions are preserved when copied
        fileMode = 0755
    }
    
    // Inject into the correct image directory structure based on OS
    if (os.isMacOsX()) {
        into("${layout.buildDirectory.get()}/jpackage/DoubleClips.app/Contents/app/bin/${binaryDir}")
    } else {
        into("${layout.buildDirectory.get()}/jpackage/DoubleClips/app/bin/${binaryDir}")
    }
}

// Hook into the jpackage lifecycle
tasks.named("jpackage") {
    dependsOn("copyFfmpegBinaries")
}
