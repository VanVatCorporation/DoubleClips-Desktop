plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.runtime' version '1.13.0'
}

group 'com.vanvatcorporation'
version '1.2.0'

dependencies {
    implementation 'io.github.mkpaz:atlantafx-base:2.0.1'
    implementation 'org.kordamp.ikonli:ikonli-javafx:12.3.1'
    implementation 'org.kordamp.ikonli:ikonli-materialdesign2-pack:12.3.1'
    implementation 'com.github.Dansoftowner:jSystemThemeDetector:3.6'

    // Networking & Auth
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
}

javafx {
    version = "21"
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.media', 'javafx.swing' ]
}

application {
    mainClass = 'com.vanvatcorporation.doubleclips.Main'
}

runtime {
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
    
    // For non-modular projects, only list standard JDK modules here.
    // JavaFX modules are automatically handled by the openjfx plugin.
    modules = [
        'java.base',
        'java.desktop',
        'java.naming',
        'java.scripting',
        'java.xml',
        'jdk.unsupported',
        'java.sql',
        'java.net.http'
    ]

    jpackage {
        imageName = 'DoubleClips'
        appVersion = '1.2.0'

        if (org.gradle.internal.os.OperatingSystem.current().macOsX) {
            imageOptions = [
                '--icon', project.file('src/main/resources/icons/app.icns').absolutePath,
                '--mac-package-identifier', 'com.vanvatcorporation.doubleclips',
                '--mac-package-name', 'DoubleClips'
            ]
            installerOptions = [
                '--icon', project.file('src/main/resources/icons/app.icns'),
                '--vendor', 'VanVat Corporation'
            ]
            installerType = 'dmg'
        } else if (org.gradle.internal.os.OperatingSystem.current().windows) {
            imageOptions = ['--icon', project.file('src/main/resources/icons/app.ico').absolutePath]
            installerOptions = [
                '--icon', project.file('src/main/resources/icons/app.ico'),
                '--vendor', 'VanVat Corporation',
                '--win-dir-chooser',
                '--win-shortcut',
                '--win-menu',
                '--type', 'exe'
            ]
            installerType = 'exe'
        }
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
// Custom task to inject FFmpeg binary into the prepared JPackage image
tasks.register("copyFfmpegBinaries", Copy) {
    mustRunAfter(tasks.named("jpackageImage"))

    def os = org.gradle.internal.os.OperatingSystem.current()
    def arch = System.getProperty("os.arch").toLowerCase()
    def isArm = arch.contains("aarch64") || arch.contains("arm")

    def binaryDir = ""
    def binaryName = ""

    if (os.isWindows()) {
        binaryDir = isArm ? "windows-arm" : "windows"
        binaryName = "bin/ffmpeg.exe"
    } else if (os.isMacOsX()) {
        // Was a single "macos" folder regardless of arch, unlike Windows
        // above - fine while every build ran on/for Intel and Apple silicon
        // Macs used Rosetta to run it, but Apple is retiring general Rosetta
        // support: Intel-only binaries stop launching on Apple silicon Macs
        // starting with macOS 28 (Rosetta 2 remains only for certain older,
        // unmaintained games after that point). A bundled ffmpeg still built
        // for one arch would then fail exports on the other Mac arch even if
        // the JVM app itself got a native build. Falls back to the legacy
        // "macos" folder (see resolveMacFfmpegBinaryDir below) for repos that
        // haven't split their bin/ folder yet.
        binaryDir = resolveMacFfmpegBinaryDir(isArm)
        binaryName = "ffmpeg"
    } else {
        // Fallback or Linux
        binaryDir = "linux"
        binaryName = "ffmpeg"
    }

    from("bin/${binaryDir}/${binaryName}") {
        // Ensure executable permissions are preserved when copied
        fileMode = 0755
    }

    // Inject into the correct image directory structure based on OS
    if (os.isMacOsX()) {
        into("${layout.buildDirectory.get()}/jpackage/DoubleClips.app/Contents/app/bin/${binaryDir}")
    } else {
        into("${layout.buildDirectory.get()}/jpackage/DoubleClips/app/bin/${binaryDir}")
    }
}

// Picks "macos-x86_64" / "macos-arm64" if that folder exists (matches
// FFmpegEditNative.getFfmpegPath()'s own lookup order on the Java side),
// otherwise falls back to the legacy shared "macos" folder so this doesn't
// break a repo that only has the one folder committed.
def resolveMacFfmpegBinaryDir(boolean isArm) {
    def archSpecific = isArm ? "macos-arm64" : "macos-x86_64"
    return project.file("bin/${archSpecific}").exists() ? archSpecific : "macos"
}

// Hook into the jpackage lifecycle
tasks.named("jpackage") {
    dependsOn("copyFfmpegBinaries")
}

// ─────────────────────────────────────────────────────────────────────────
//  Universal ("either Mac") installer
// ─────────────────────────────────────────────────────────────────────────
// jpackage bakes the *build machine's* architecture into whatever it
// produces (see JDK-8266179 - the .pkg's hostArchitectures attribute comes
// straight from the JVM running jpackage, via System.getProperty("os.arch")).
// There is no jlink/jpackage option to emit one truly-universal Mach-O app
// image from a single build; Oracle's own investigation into that
// (JDK-8266259) never shipped as a jpackage feature. So getting BOTH
// distributables means:
//   1. Two separate jpackage runs, each producing its own single-arch app -
//      one run with an aarch64 JDK on Apple silicon hardware (jpackage can
//      only emit for the arch it's actually running on), one run with an
//      x86_64 JDK (either on an Intel Mac, or on Apple silicon hardware
//      under Rosetta - Rosetta can still run an x86_64 JDK's jpackage, just
//      not the reverse). In CI this is a build-matrix concern (e.g. a
//      macos-13 Intel runner + a macos-14/15 Apple silicon runner), not
//      something this build.gradle alone can express.
//   2. A "universal" download that still gives every user one link: this
//      task wraps both ALREADY-BUILT per-arch .app bundles into one
//      productbuild .pkg whose installer picks the matching payload at
//      *install time* via macOS's own system.arch predicate mechanism (the
//      same mechanism jpackage itself uses for hostArchitectures) - not a
//      merged binary, but one file, one download, that installs correctly
//      on either Mac.
//
// Usage: after producing both DoubleClips.app bundles (one per arch, see
// scripts/build-universal-installer.sh), run:
//   ./gradlew buildUniversalInstaller \
//       -PintelAppPath=/path/to/x86_64/DoubleClips.app \
//       -ParmAppPath=/path/to/arm64/DoubleClips.app
tasks.register("buildUniversalInstaller", Exec) {
    group = "distribution"
    description = "Wraps a pre-built Intel .app and Apple silicon .app into one arch-picking .pkg installer."

    onlyIf { org.gradle.internal.os.OperatingSystem.current().macOsX }

    doFirst {
        if (!project.hasProperty("intelAppPath") || !project.hasProperty("armAppPath")) {
            throw new GradleException(
                "buildUniversalInstaller needs both -PintelAppPath=... and -ParmAppPath=... " +
                "pointing at the two already-built DoubleClips.app bundles (see scripts/build-universal-installer.sh).")
        }
    }

    def outputDir = "${layout.buildDirectory.get()}/universal-installer"
    commandLine "bash", "${project.rootDir}/scripts/build-universal-installer.sh",
            "--intel-app", project.findProperty("intelAppPath") ?: "",
            "--arm-app", project.findProperty("armAppPath") ?: "",
            "--version", project.version.toString(),
            "--out-dir", outputDir
}
